name: Publish rach3 update
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and verify everything without a tag or publishing
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
concurrency:
  group: rach3-release
  cancel-in-progress: false
jobs:
  build:
    # macos-15 is Apple Silicon. It builds the universal app with both portable runtimes.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      UV_NO_CACHE: '1'
      PIP_NO_CACHE_DIR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release inputs
        run: |
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          release=json.loads(Path('desktop/release.json').read_text())
          assert platform.machine()=='arm64', 'Use the macos-15 Apple Silicon runner'
          assert os.environ['SPARKLE_PRIVATE_KEY'], 'Configure the SPARKLE_PRIVATE_KEY repository secret first'
          assert os.environ['GITHUB_REPOSITORY']==release['repository'], 'Wrong release repository'
          if not os.environ['DRY_RUN']:
              assert os.environ['GITHUB_REF_TYPE']=='tag', 'Run this workflow on a version tag'
              assert os.environ['GITHUB_REF_NAME']=='v'+release['version'], 'Run on the matching release.json version tag'
              assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==subprocess.check_output(['git','rev-list','-n','1',os.environ['GITHUB_REF_NAME']],text=True).strip(), 'Checkout must match the release tag'
          assert isinstance(release['build'],int) and release['build']>0, 'Release build must be a positive integer'
          PY
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.4'
          enable-cache: false
      - name: Verify signing secret matches the app public key
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('desktop').resolve()))
          from release import prepare, sign, verify_archive
          prepare()
          probe=Path(os.environ['RUNNER_TEMP'])/'piano-signing-input'
          probe.write_text('rach3 release signing verification')
          try:
              verify_archive(probe, sign(probe))
          finally:
              probe.unlink(missing_ok=True)
          PY
      - name: Prepare small portable runtime
        run: python3 desktop/prepare_engine.py
      - name: Fetch Codex for both Mac processors
        # ChatGPT features (With AI, Customize) run Codex, Apache-2.0, from github.com/openai/codex.
        run: |
          set -euo pipefail
          version=0.167.0
          folder="$RUNNER_TEMP/codex"
          mkdir -p "$folder/vendor"
          cd "$folder"
          for arch in arm64 x64; do
            npm pack --silent "@openai/codex@$version-darwin-$arch"
            mkdir "unpack-$arch"
            tar -xzf "openai-codex-$version-darwin-$arch.tgz" -C "unpack-$arch"
            cp -R "unpack-$arch/package/vendor/." vendor/
          done
          test -x vendor/aarch64-apple-darwin/bin/codex
          test -x vendor/x86_64-apple-darwin/bin/codex
          echo "RACH3_CODEX_VENDOR=$folder/vendor" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the Electron shell for both Mac processors
        # npm ci installs this Mac's Electron. The Intel build of the same version comes from
        # Electron's release and must match the checksum the electron package itself carries.
        run: |
          set -euo pipefail
          npm ci
          version=$(node -p "require('electron/package.json').version")
          name="electron-v$version-darwin-x64.zip"
          curl -fsSL -o "$RUNNER_TEMP/$name" "https://github.com/electron/electron/releases/download/v$version/$name"
          expected=$(node -p "require('electron/checksums.json')['$name']")
          test "$(shasum -a 256 "$RUNNER_TEMP/$name" | cut -d' ' -f1)" = "$expected"
          mkdir -p build/electron/darwin-x64
          ditto -x -k "$RUNNER_TEMP/$name" build/electron/darwin-x64
          test -d build/electron/darwin-x64/Electron.app
      - name: Build application and DMG installer
        run: python3 desktop/build.py
      - name: Fetch small signed baseline when available
        # A dry run has no newer build than the latest release to patch onto.
        if: ${{ !inputs.dry_run }}
        run: python3 desktop/release.py --baseline
      - name: Create and verify ZIP update and optional delta
        run: python3 desktop/release.py
      - name: Keep the signed release files for Intel verification and publishing
        uses: actions/upload-artifact@v4
        with:
          name: rach3-release
          path: |
            dist/rach3-*.zip
            dist/rach3-*.delta
            dist/rach3-Setup.dmg
            dist/update-signature.json
            dist/release-notes.txt
          if-no-files-found: error
          retention-days: 14

  intel:
    # Real Intel hardware. Nothing is published unless the universal app works here.
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rach3-release
          path: dist
      - name: Unpack the signed update exactly as Sparkle receives it
        run: ditto -x -k dist/rach3-*.zip dist
      - name: Check the DMG installs the same signed app on Intel
        run: |
          hdiutil verify dist/rach3-Setup.dmg
          mount="$RUNNER_TEMP/piano-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/rach3-Setup.dmg
          codesign --verify --deep --strict "$mount/rach3.app"
          diff -rq "$mount/rach3.app" "dist/rach3.app"
          test "$(readlink "$mount/Applications")" = /Applications
          hdiutil detach "$mount"
      - name: Fetch the signed baseline that update deltas start from
        if: ${{ !inputs.dry_run }}
        run: python3 desktop/release.py --baseline
      - name: Verify bundle, updates and the Intel lesson engine
        run: python3 desktop/verify_intel.py
      - name: Open the Intel app and capture its screens
        run: |
          python3 desktop/sparkle.py
          python3 desktop/build.py --capture-assets "$RUNNER_TEMP/intel-screens"
          test -s "$RUNNER_TEMP/intel-screens/practice.png"
          test -s "$RUNNER_TEMP/intel-screens/create-lesson.png"
      - name: Keep the Intel screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: intel-screens
          path: ${{ runner.temp }}/intel-screens
          if-no-files-found: ignore
          retention-days: 14

  windows:
    # A real Windows machine. The lesson engine, the app window, the installer and the
    # installed app are all checked before anything is published.
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.4'
          enable-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create lessons from MIDI, PDF and audio on Windows
        run: python windows/verify_engine.py
      - name: Install the Electron shell
        run: npm ci
      - name: Open the Windows app, capture its screens and create a lesson through the page
        run: python windows/build.py --capture "$env:RUNNER_TEMP\windows-screens"
      - name: Install the Velopack packager
        run: |
          dotnet tool install -g vpk --version 1.2.161
          python -m pip install cryptography==46.0.3
      - name: Package, install with Setup.exe, create a lesson and install a signed update
        run: python windows/build.py --package
      - name: Keep the Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: rach3-windows
          path: dist/windows/releases
          if-no-files-found: error
          retention-days: 14
      - name: Keep the Windows screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-screens
          path: ${{ runner.temp }}/windows-screens
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [build, intel, windows]
    if: ${{ !inputs.dry_run }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rach3-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: rach3-windows
          path: dist/windows/releases
      - name: Prepare Sparkle signing tools
        run: python3 desktop/sparkle.py
      - name: Publish installer, update and signed feed
        run: python3 desktop/release.py --publish
