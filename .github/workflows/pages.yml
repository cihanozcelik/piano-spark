name: Publish PianoMan website
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pianoman-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build product website and signed update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > build/published-release.json; then
            gh api "repos/$GITHUB_REPOSITORY/contents/appcast.xml?ref=updates" -H 'Accept: application/vnd.github.raw+json' > build/published-appcast.xml
            python3 site/build.py --release-info build/published-release.json --appcast build/published-appcast.xml
          else
            python3 site/build.py
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
