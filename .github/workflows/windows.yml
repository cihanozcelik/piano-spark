name: Windows checks

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Lesson engine on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create lessons from MIDI, PDF and audio
        env:
          PYTHONUTF8: '1'
        run: python windows/verify_engine.py

  app:
    name: Windows app window and bridge
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, open the app, take screenshots and create a lesson through the page
        env:
          PYTHONUTF8: '1'
        run: python windows/build.py --capture "$env:RUNNER_TEMP\windows-screens"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screens
          path: ${{ runner.temp }}/windows-screens
          if-no-files-found: ignore

  installer:
    name: Windows installer and installed app
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Velopack packager
        run: |
          dotnet tool install -g vpk --version 1.2.161
          python -m pip install cryptography==46.0.3
      - name: Package, install with Setup.exe, create a lesson and install a signed update
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: python windows/build.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: rach3-windows
          path: dist/windows/releases
          if-no-files-found: error
          retention-days: 7
