name: Windows checks

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Lesson engine on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create lessons from MIDI, PDF and audio
        env:
          PYTHONUTF8: '1'
        run: python windows/verify_engine.py

  app:
    name: Windows app window and bridge
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, open the app, take screenshots and create a lesson through the page
        env:
          PYTHONUTF8: '1'
        run: python windows/build.py --capture "$env:RUNNER_TEMP\windows-screens"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screens
          path: ${{ runner.temp }}/windows-screens
          if-no-files-found: ignore
