name: Windows checks

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Lesson engine on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create lessons from MIDI, PDF and audio
        env:
          PYTHONUTF8: '1'
        run: python windows/verify_engine.py

  app:
    name: Windows app window and bridge
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the Electron shell
        # npm ci installs the packages; Electron's own program arrives with its installer.
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Build, open the app, take screenshots and create a lesson through the page
        env:
          PYTHONUTF8: '1'
        run: python windows/build.py --capture "$env:RUNNER_TEMP\windows-screens"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screens
          path: ${{ runner.temp }}/windows-screens
          if-no-files-found: ignore

  customize:
    name: ChatGPT features and Codex limits on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the Electron shell
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Fetch the Codex the app carries
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          folder=$(python -c "import sys; sys.path[:0] = ['windows', 'desktop']; import build; print(build.codex_vendor())" | tail -n 1 | tr -d '\r')
          test -f "$folder/bin/codex.exe"
          echo "RACH3_TEST_CODEX=$folder" >> "$GITHUB_ENV"
      - name: Try the ChatGPT features, and what a command Codex runs may reach
        # Codex talks to a stand-in for OpenAI on this machine; no ChatGPT account is used.
        shell: bash
        run: npx electron electron/tests/customize.test.js

  installer:
    name: Windows installer and installed app
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the Electron shell
        # npm ci installs the packages; Electron's own program arrives with its installer.
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Install the Velopack packager
        run: |
          dotnet tool install -g vpk --version 1.2.161
          python -m pip install cryptography==46.0.3
      - name: Package, install with Setup.exe, create a lesson and install a signed update
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: python windows/build.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: rach3-windows
          path: dist/windows/releases
          if-no-files-found: error
          retention-days: 7
